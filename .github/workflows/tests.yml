name: tests

# Guards the physiological monotonicity-penalty perturbation against the
# standardised-space bug (it must correspond to x' = 1.5*x in raw units).
# Runs on every push and pull request.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  perturbation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Run perturbation unit tests
        run: pytest -q tests/test_perturbation.py
